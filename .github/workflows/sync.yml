name: Sync books and writing

on:
  schedule:
    - cron: "17 5 * * 1,4" # Mondays and Thursdays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate pages from Goodreads and Substack
        run: python3 scripts/sync.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "tadimadz-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Sync books and writing ($(date -u +%F))"
          git push
